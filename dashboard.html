<!DOCTYPE html>
<html>
<head>
  <title>DIKU_GAMERZ's World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a1a2e, #0d0d15);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: white;
      text-align: center;
    }

    /* The glowing zoom title */
    .title {
      font-size: 48px;
      font-weight: bold;
      color: #00f7ff;
      cursor: default;
      transition: transform 0.3s ease, text-shadow 0.3s ease;
    }

    .title:hover {
      transform: scale(1.15);
      text-shadow:
        0 0 10px #00f7ff,
        0 0 25px #00f7ff,
        0 0 45px #00f7ff;
    }

    .welcome {
      margin-top: 15px;
      font-size: 18px;
      color: #cccccc;
    }

    /* Social buttons row */
    .socials {
      margin-top: 40px;
      display: flex;
      gap: 25px;
    }

    .social-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1e2f;
      text-decoration: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    .social-btn svg {
      width: 26px;
      height: 26px;
      fill: white;
    }

    .social-btn:hover {
      transform: scale(1.2);
    }

    .instagram:hover { background: #d6249f; box-shadow: 0 0 20px #d6249f; }
    .facebook:hover  { background: #1877f2; box-shadow: 0 0 20px #1877f2; }
    .discord:hover   { background: #5865f2; box-shadow: 0 0 20px #5865f2; }
    .youtube:hover   { background: #ff0000; box-shadow: 0 0 20px #ff0000; }

  </style>
</head>
